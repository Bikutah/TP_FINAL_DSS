# Tema "cálido y amigable" del DSS Salud Escolar.
# Probado con Streamlit 1.67. Las opciones de tipografía y colores de gráficos
# son nuevas: con versiones viejas de Streamlit se ignoran o dan error.

[theme]
base = "light"
primaryColor = "#2F6F5E"              # verde de acento: botones, selección, links
backgroundColor = "#FBF7F1"           # fondo crema de la app
secondaryBackgroundColor = "#F6EFE5"  # fondo de widgets y tarjetas de KPI
textColor = "#2B2118"                 # texto principal (marrón casi negro)
linkColor = "#2F6F5E"
borderColor = "#E6DACB"
showWidgetBorder = true
showSidebarBorder = false
baseRadius = "0.75rem"
buttonRadius = "full"

# Tipografías de Google Fonts. Necesitan internet; si no hay, el navegador usa su sans-serif.
font = "Nunito Sans:https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;600;700&display=swap"
headingFont = "Nunito:https://fonts.googleapis.com/css2?family=Nunito:wght@700;800&display=swap"
headingFontWeights = [800, 800, 800, 700, 700, 700]
metricValueFontWeight = 800

# Colores de los 5 perfiles, siempre en este orden:
# Baja prevalencia de problemáticas, Alcohol sin borracheras, Consumo de riesgo,
# Malestar emocional, Violencia entre pares.
chartCategoricalColors = ["#D9CFC2", "#EBB548", "#B84A33", "#6B4E9B", "#5FA8C6"]

[theme.sidebar]
backgroundColor = "#F3EBDF"
secondaryBackgroundColor = "#FFFFFF"

[server]
# Sirve app/static/ (el mapa base de Plotly), así el mapa anda sin internet
enableStaticServing = true

[client]
# Esconde el botón "Deploy" y el menú de desarrollador
toolbarMode = "viewer"
